<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Zephyr Weather</title>
    <link href="style.css" rel="stylesheet">

    <link href="assets/marshmallow.png" rel="icon" type="image/png">
</head>
<body>
<div class="container">
    <h2>Получить погоду</h2>

    <label for="location">Адрес / город</label>
    <input autocomplete="off" id="location" placeholder="Начните вводить..." type="text">
    <ul id="suggestions"></ul>

    <label for="provider">Сервис погоды</label>
    <select id="provider">
    </select>

    <button id="getWeather">Получить погоду</button>

    <div id="result"></div>
</div>

<script src="data/providers.js"></script>
<script src="app.js"></script>
</body>
</html>
